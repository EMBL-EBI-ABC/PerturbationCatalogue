<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #374151; stroke-width: 2; rx: 14; ry: 14; }
      .input { fill: #ecfdf5; stroke: #059669; }
      .process { fill: #ecfeff; stroke: #0891b2; }
      .merge { fill: #ecfdf5; stroke: #059669; }
      .output { fill: #ecfdf5; stroke: #059669; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #374151; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #4b5563; }
      .arrow { stroke: #374151; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="20" y="30" width="1240" height="540" rx="22" fill="#f9fafb" stroke="#e5e7eb"/>

  <!-- Step 1: Raw H5AD -->
  <rect class="box input" x="80" y="240" width="220" height="120"/>
  <text class="label" x="190" y="290" text-anchor="middle">Raw H5AD</text>
  <text class="small" x="190" y="325" text-anchor="middle">Unfiltered counts</text>

  <path class="arrow" d="M300 300 L380 300"/>

  <!-- Step 2: Processing -->
  <rect class="box process" x="380" y="240" width="220" height="120"/>
  <text class="label" x="490" y="280" text-anchor="middle">Filtering + QC</text>
  <text class="small" x="490" y="310" text-anchor="middle">Probe calling</text>
  <text class="small" x="490" y="335" text-anchor="middle">Cell selection</text>

  <path class="arrow" d="M600 300 L680 300"/>

  <!-- Step 3: Filtered H5AD -->
  <rect class="box output" x="680" y="240" width="220" height="120"/>
  <text class="label" x="790" y="290" text-anchor="middle">Filtered H5AD</text>
  <text class="small" x="790" y="325" text-anchor="middle">Clean dataset</text>

  <path class="arrow" d="M900 300 L980 300"/>

  <!-- Step 4: Analysis Pipeline -->
  <rect class="box process" x="980" y="240" width="220" height="120"/>
  <text class="label" x="1090" y="285" text-anchor="middle">DEA + GSEA</text>
  <text class="small" x="1090" y="320" text-anchor="middle">Unified pipeline</text>

  <path class="arrow" d="M1090 240 C1090 200 1090 180 1090 140"/>
  <path class="arrow" d="M1090 360 C1090 400 1090 420 1090 460"/>

  <!-- Outputs -->
  <rect class="box merge" x="980" y="40" width="220" height="100"/>
  <text class="label" x="1090" y="90" text-anchor="middle">DEA Results</text>

  <rect class="box merge" x="980" y="460" width="220" height="100"/>
  <text class="label" x="1090" y="510" text-anchor="middle">GSEA Results</text>

</svg>