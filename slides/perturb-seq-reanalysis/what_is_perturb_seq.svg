<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f8fafc; stroke: #d9e2ec; stroke-width: 1.4; }
      .panel-soft { fill: #ffffff; stroke: #d9e2ec; stroke-width: 1.2; }
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 23px; font-weight: 700; fill: #14213d; }
      .subtitle { font-family: Helvetica, Arial, sans-serif; font-size: 15px; fill: #53657d; }
      .label { font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #25364d; }
      .small { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #53657d; }
      .tiny { font-family: Helvetica, Arial, sans-serif; font-size: 11px; fill: #6b7c93; }
      .mono { font-family: "Courier New", monospace; font-size: 12px; font-weight: 700; fill: #ffffff; }
      .mono-dark { font-family: "Courier New", monospace; font-size: 12px; font-weight: 700; fill: #243447; }
      .badge { fill: #007a5a; }
      .line { stroke: #8ca0b3; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #b8c4d0; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .cell { fill: #ffffff; stroke: #9fb3c8; stroke-width: 2; }
      .nucleus { fill: #edf2f7; stroke: #d9e2ec; stroke-width: 1.5; }
      .bead { fill: #dff6ff; stroke: #4fb3d6; stroke-width: 2; }
      .droplet { fill: #ffffff; stroke: #4fb3d6; stroke-width: 2.4; }
      .guide-red { stroke: #d94841; fill: none; stroke-width: 3; stroke-linecap: round; }
      .guide-blue { stroke: #2f80ed; fill: none; stroke-width: 3; stroke-linecap: round; }
      .guide-green { stroke: #10a66a; fill: none; stroke-width: 3; stroke-linecap: round; }
      .cbc { fill: #7c3aed; }
      .umi { fill: #f59f00; }
      .handle { fill: #d9e2ec; }
      .gene { fill: #007a5a; }
      .heat0 { fill: #eef3f8; }
      .heat1 { fill: #cbd6e2; }
      .heat2 { fill: #7e91a6; }
      .heat3 { fill: #26384f; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8ca0b3"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="600"/>

  <g transform="translate(26,28)">
    <rect class="panel" x="0" y="0" width="278" height="544" rx="8"/>
    <circle class="badge" cx="30" cy="31" r="17"/>
    <text class="mono" x="30" y="36" text-anchor="middle">1</text>
    <text class="title" x="58" y="38">Perturb cells</text>
    <text class="subtitle" x="22" y="70">A pooled CRISPR library gives</text>
    <text class="subtitle" x="22" y="91">each cell a guide RNA.</text>

    <g transform="translate(74,180)">
      <path class="cell" d="M -42,-18 C -35,-56 15,-58 43,-28 C 69,0 50,48 8,55 C -38,63 -68,23 -42,-18 Z"/>
      <circle class="nucleus" cx="-3" cy="7" r="21"/>
      <path class="guide-red" d="M 29,-18 Q 51,-32 60,-8 Q 54,8 35,5"/>
    </g>
    <g transform="translate(186,338)">
      <path class="cell" d="M -48,-12 C -51,-51 -7,-65 32,-43 C 65,-24 69,28 31,50 C -9,73 -62,43 -48,-12 Z"/>
      <circle class="nucleus" cx="4" cy="3" r="20"/>
      <path class="guide-blue" d="M -19,26 Q -33,50 -6,58 Q 16,62 26,40"/>
    </g>
    <g transform="translate(74,412)">
      <path class="cell" d="M -32,-14 C -18,-51 30,-49 45,-17 C 62,21 30,55 -8,49 C -47,43 -59,7 -32,-14 Z"/>
      <circle class="nucleus" cx="5" cy="5" r="17"/>
      <path class="guide-green" d="M 27,-21 Q 45,-35 52,-12 Q 48,6 31,4"/>
    </g>
    <text class="label" x="139" y="501" text-anchor="middle">Known input</text>
    <text class="small" x="139" y="524" text-anchor="middle">which guide each cell received</text>
  </g>

  <path class="line" d="M 317,300 L 350,300" marker-end="url(#arrow)"/>

  <g transform="translate(354,28)">
    <rect class="panel" x="0" y="0" width="278" height="544" rx="8"/>
    <circle class="badge" cx="30" cy="31" r="17"/>
    <text class="mono" x="30" y="36" text-anchor="middle">2</text>
    <text class="title" x="58" y="38">Capture cells</text>
    <text class="subtitle" x="22" y="70">Single-cell RNA-seq puts one</text>
    <text class="subtitle" x="22" y="91">cell and one bead in a droplet.</text>

    <path class="panel-soft" d="M 35,230 L 116,230 L 116,176 L 162,176 L 162,230 L 242,230 L 242,312 L 162,312 L 162,368 L 116,368 L 116,312 L 35,312 Z"/>
    <path class="thin" d="M 139,196 L 139,224" marker-end="url(#arrow)"/>
    <path class="thin" d="M 139,348 L 139,320" marker-end="url(#arrow)"/>
    <circle class="bead" cx="75" cy="258" r="16"/>
    <g transform="translate(101,284) scale(0.35)">
      <path class="cell" d="M -32,-14 C -18,-51 30,-49 45,-17 C 62,21 30,55 -8,49 C -47,43 -59,7 -32,-14 Z"/>
      <circle class="nucleus" cx="5" cy="5" r="17"/>
      <path class="guide-blue" d="M -18,28 Q -31,44 -10,51 Q 10,55 21,39" stroke-width="5" fill="none" stroke="#2f80ed"/>
    </g>
    <g transform="translate(191,271)">
      <circle class="droplet" cx="0" cy="0" r="40"/>
      <circle class="bead" cx="-13" cy="-10" r="16"/>
      <g transform="translate(17,10) scale(0.35)">
        <path class="cell" d="M -32,-14 C -18,-51 30,-49 45,-17 C 62,21 30,55 -8,49 C -47,43 -59,7 -32,-14 Z"/>
        <circle class="nucleus" cx="5" cy="5" r="17"/>
        <path class="guide-blue" d="M -18,28 Q -31,44 -10,51 Q 10,55 21,39" stroke-width="5" fill="none" stroke="#2f80ed"/>
      </g>
    </g>
    <text class="label" x="139" y="501" text-anchor="middle">Shared barcode</text>
    <text class="small" x="139" y="524" text-anchor="middle">marks all molecules from that cell</text>
  </g>

  <path class="line" d="M 645,300 L 678,300" marker-end="url(#arrow)"/>

  <g transform="translate(682,28)">
    <rect class="panel" x="0" y="0" width="302" height="544" rx="8"/>
    <circle class="badge" cx="30" cy="31" r="17"/>
    <text class="mono" x="30" y="36" text-anchor="middle">3</text>
    <text class="title" x="58" y="38">Read two signals</text>
    <text class="subtitle" x="22" y="70">The same cell barcode links</text>
    <text class="subtitle" x="22" y="91">guide identity and expression.</text>

    <g transform="translate(30,160)">
      <rect class="panel-soft" x="0" y="0" width="242" height="114" rx="8"/>
      <text class="label" x="16" y="28">mRNA read</text>
      <line x1="22" y1="63" x2="201" y2="63" stroke="#6b7c93" stroke-width="2"/>
      <rect class="cbc" x="38" y="50" width="46" height="26" rx="4"/>
      <text class="mono" x="61" y="68" text-anchor="middle">CBC</text>
      <rect class="umi" x="91" y="50" width="42" height="26" rx="4"/>
      <text class="mono" x="112" y="68" text-anchor="middle">UMI</text>
      <rect class="handle" x="140" y="50" width="72" height="26" rx="4"/>
      <text class="mono-dark" x="176" y="68" text-anchor="middle">Gene</text>
      <path class="thin" d="M 205,50 Q 230,32 258,48"/>
    </g>
    <g transform="translate(30,314)">
      <rect class="panel-soft" x="0" y="0" width="242" height="114" rx="8"/>
      <text class="label" x="16" y="28">Guide read</text>
      <line x1="22" y1="63" x2="201" y2="63" stroke="#6b7c93" stroke-width="2"/>
      <rect class="cbc" x="38" y="50" width="46" height="26" rx="4"/>
      <text class="mono" x="61" y="68" text-anchor="middle">CBC</text>
      <rect class="umi" x="91" y="50" width="42" height="26" rx="4"/>
      <text class="mono" x="112" y="68" text-anchor="middle">UMI</text>
      <rect class="handle" x="140" y="50" width="72" height="26" rx="4"/>
      <text class="mono-dark" x="176" y="68" text-anchor="middle">Guide</text>
      <path class="guide-blue" d="M 204,50 Q 222,27 238,50 Q 250,65 266,40"/>
    </g>
    <path class="thin" d="M 91,236 L 91,350"/>
    <text class="tiny" x="101" y="295">same cell barcode</text>
  </g>

  <path class="line" d="M 997,300 L 1030,300" marker-end="url(#arrow)"/>

  <g transform="translate(1034,28)">
    <rect class="panel" x="0" y="0" width="220" height="544" rx="8"/>
    <circle class="badge" cx="30" cy="31" r="17"/>
    <text class="mono" x="30" y="36" text-anchor="middle">4</text>
    <text class="title" x="58" y="38">Build matrix</text>
    <text class="subtitle" x="22" y="70">Each row is one cell:</text>
    <text class="subtitle" x="22" y="91">guide plus gene expression.</text>

    <g transform="translate(18,142)">
      <rect class="panel-soft" x="0" y="0" width="184" height="236" rx="8"/>
      <text class="label" x="23" y="31" text-anchor="middle">Cell</text>
      <text class="label" x="89" y="31" text-anchor="middle">Guide</text>
      <text class="label" x="151" y="31" text-anchor="middle">Genes</text>
      <line x1="12" y1="45" x2="172" y2="45" stroke="#d9e2ec" stroke-width="2"/>

      <g transform="translate(12,64)">
        <rect class="cbc" x="0" y="0" width="48" height="24" rx="4"/>
        <text class="mono" x="24" y="17" text-anchor="middle">C1</text>
        <rect class="gene" x="67" y="0" width="46" height="24" rx="4"/>
        <text class="mono" x="90" y="17" text-anchor="middle">A</text>
        <rect class="heat0" x="126" y="3" width="13" height="18"/>
        <rect class="heat3" x="143" y="3" width="13" height="18"/>
        <rect class="heat1" x="160" y="3" width="13" height="18"/>
      </g>
      <g transform="translate(12,110)">
        <rect class="cbc" x="0" y="0" width="48" height="24" rx="4"/>
        <text class="mono" x="24" y="17" text-anchor="middle">C2</text>
        <rect class="gene" x="67" y="0" width="46" height="24" rx="4"/>
        <text class="mono" x="90" y="17" text-anchor="middle">B</text>
        <rect class="heat2" x="126" y="3" width="13" height="18"/>
        <rect class="heat0" x="143" y="3" width="13" height="18"/>
        <rect class="heat3" x="160" y="3" width="13" height="18"/>
      </g>
      <g transform="translate(12,156)">
        <rect class="cbc" x="0" y="0" width="48" height="24" rx="4"/>
        <text class="mono" x="24" y="17" text-anchor="middle">C3</text>
        <rect class="gene" x="67" y="0" width="46" height="24" rx="4"/>
        <text class="mono" x="90" y="17" text-anchor="middle">NT</text>
        <rect class="heat1" x="126" y="3" width="13" height="18"/>
        <rect class="heat1" x="143" y="3" width="13" height="18"/>
        <rect class="heat0" x="160" y="3" width="13" height="18"/>
      </g>
      <text class="small" x="92" y="212" text-anchor="middle">...</text>
    </g>

    <text class="label" x="110" y="501" text-anchor="middle">Analysis-ready</text>
    <text class="small" x="110" y="524" text-anchor="middle">perturbation effect per cell</text>
  </g>
</svg>
