<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #374151; stroke-width: 2; rx: 14; ry: 14; }
      .input { fill: #eef2ff; stroke: #4f46e5; }
      .process { fill: #ecfeff; stroke: #0891b2; }
      .merge { fill: #fef3c7; stroke: #d97706; }
      .output { fill: #ecfdf5; stroke: #059669; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #374151; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #4b5563; }
      .arrow { stroke: #374151; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="20" y="30" width="1240" height="540" rx="22" fill="#f9fafb" stroke="#e5e7eb"/>

  <!-- Step 1: Input -->
  <rect class="box input" x="80" y="200" width="220" height="120"/>
  <text class="label" x="190" y="250" text-anchor="middle">Single Cell</text>
  <text class="small" x="190" y="285" text-anchor="middle">mRNA + sgRNA</text>

  <path class="arrow" d="M300 260 L380 260"/>

  <!-- Step 2: Process -->
  <rect class="box process" x="380" y="200" width="220" height="120"/>
  <text class="label" x="490" y="250" text-anchor="middle">Library Prep</text>
  <text class="small" x="490" y="285" text-anchor="middle">Reverse Transcription</text>

  <path class="arrow" d="M600 260 L680 260"/>

  <!-- Step 3: Sequencing -->
  <rect class="box process" x="680" y="200" width="220" height="120"/>
  <text class="label" x="790" y="250" text-anchor="middle">Sequencing</text>
  <text class="small" x="790" y="285" text-anchor="middle">Read Pairs</text>

  <path class="arrow" d="M900 260 C940 260 940 160 980 160"/>
  <path class="arrow" d="M900 260 C940 260 940 360 980 360"/>

  <!-- Two Dimensions -->
  <rect class="box output" x="980" y="100" width="220" height="120"/>
  <text class="label" x="1090" y="150" text-anchor="middle">Gene Expression</text>
  <text class="small" x="1090" y="185" text-anchor="middle">Transcript Counts</text>

  <rect class="box output" x="980" y="300" width="220" height="120"/>
  <text class="label" x="1090" y="350" text-anchor="middle">Guide Identity</text>
  <text class="small" x="1090" y="385" text-anchor="middle">Perturbation Labels</text>

  <text class="note" x="640" y="520" text-anchor="middle">One assay, two measurements: "What changed?" vs "Why did it change?"</text>

</svg>