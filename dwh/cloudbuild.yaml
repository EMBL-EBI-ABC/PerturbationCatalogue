# DWH Pipeline — Cloud Build Configuration
#
# Runs the pipeline stages sequentially:
#   1. preflight        (read-only safety checks)
#   2. reference load   (Open Targets target parquet → BQ reference table)
#   3. dbt run          (BQ source → BQ final tables)
#   4. bq_to_postgres   (BQ final tables → Postgres)
#   5. bq_to_es         (BQ summary tables → Elasticsearch)
#
# Triggered via: ./trigger_pipeline.sh [--suppress-datasets id1,id2,...] [--force-pg-tables table1,table2,...]
#
# Substitution variables (passed by trigger_pipeline.sh):
#   _GCLOUD_PROJECT, _GCLOUD_REGION, _BQ_DATASET, _BQ_REFERENCE_DATASET,
#   _BQ_OPENTARGETS_TARGETS_TABLE, _BQ_LOCATION, _OPENTARGETS_RELEASE,
#   _GCLOUD_TMP_BUCKET, _PG_CONN_INTERNAL, _PG_*,
#   _ES_URL, _ES_USERNAME, _ES_PASSWORD, _ES_*,
#   _SUPPRESS_DATASETS (optional, comma-separated)
#   _FORCE_PG_TABLES (optional, comma-separated logical BQ/PG table names)

timeout: 86400s  # 24 hours

options:
  logging: LEGACY
  pool:
    name: projects/$PROJECT_ID/locations/$_GCLOUD_REGION/workerPools/dwh-pipeline-pool

steps:
  # Step 0: Build the pipeline Docker image
  - name: gcr.io/cloud-builders/docker
    id: build-image
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/dwh-pipeline:$BUILD_ID
      - -f
      - Dockerfile
      - .

  # Step 1: read-only safety preflight
  - name: gcr.io/$PROJECT_ID/dwh-pipeline:$BUILD_ID
    id: ensg-dev-preflight
    dir: /app/preflight
    entrypoint: python3
    args:
      - ensg_dev_preflight.py
    env:
      - GCLOUD_PROJECT=$_GCLOUD_PROJECT
      - BQ_DATASET=$_BQ_DATASET
      - BQ_REFERENCE_DATASET=$_BQ_REFERENCE_DATASET
      - BQ_OPENTARGETS_TARGETS_TABLE=$_BQ_OPENTARGETS_TARGETS_TABLE
      - BQ_LOCATION=$_BQ_LOCATION
      - PG_CONN_INTERNAL=$_PG_CONN_INTERNAL
      - PG_CRISPR_DATA_TABLE=$_PG_CRISPR_DATA_TABLE
      - PG_MAVE_DATA_TABLE=$_PG_MAVE_DATA_TABLE
      - PG_PERTURB_SEQ_DEA_TABLE=$_PG_PERTURB_SEQ_DEA_TABLE
      - PG_PERTURB_SEQ_GSEA_TABLE=$_PG_PERTURB_SEQ_GSEA_TABLE
      - PG_SYNC_STATE_TABLE=$_PG_SYNC_STATE_TABLE
      - PG_PERTURB_SEQ_SUMMARY_PERTURBATION=$_PG_PERTURB_SEQ_SUMMARY_PERTURBATION
      - PG_PERTURB_SEQ_SUMMARY_EFFECT=$_PG_PERTURB_SEQ_SUMMARY_EFFECT
      - PG_PERTURB_SEQ_SUMMARY_DATASET=$_PG_PERTURB_SEQ_SUMMARY_DATASET
      - ES_URL=$_ES_URL
      - ES_USERNAME=$_ES_USERNAME
      - ES_PASSWORD=$_ES_PASSWORD
      - ES_DATASET_SUMMARY=$_ES_DATASET_SUMMARY
      - ES_TARGET_SUMMARY=$_ES_TARGET_SUMMARY
      - ES_LANDING_PAGE_SUMMARY=$_ES_LANDING_PAGE_SUMMARY

  # Step 2: Open Targets reference load
  - name: gcr.io/$PROJECT_ID/dwh-pipeline:$BUILD_ID
    id: load-opentargets-reference
    dir: /app/reference
    entrypoint: python3
    args:
      - load_opentargets_targets.py
    env:
      - GCLOUD_PROJECT=$_GCLOUD_PROJECT
      - BQ_REFERENCE_DATASET=$_BQ_REFERENCE_DATASET
      - BQ_OPENTARGETS_TARGETS_TABLE=$_BQ_OPENTARGETS_TARGETS_TABLE
      - BQ_LOCATION=$_BQ_LOCATION
      - OPENTARGETS_RELEASE=$_OPENTARGETS_RELEASE

  # Step 3: dbt run
  - name: gcr.io/$PROJECT_ID/dwh-pipeline:$BUILD_ID
    id: dbt-run
    dir: /app/bq_dbt
    entrypoint: bash
    args:
      - -c
      - |
        if [ -n "$_SUPPRESS_DATASETS" ]; then
          echo "Running dbt with suppressed datasets: $_SUPPRESS_DATASETS"
          dbt run --profiles-dir . --vars "{\"suppress_datasets\": \"$_SUPPRESS_DATASETS\"}"
        else
          echo "Running dbt (no datasets suppressed)"
          dbt run --profiles-dir .
        fi
    env:
      - GCLOUD_PROJECT=$_GCLOUD_PROJECT
      - BQ_DATASET=$_BQ_DATASET
      - BQ_REFERENCE_DATASET=$_BQ_REFERENCE_DATASET
      - BQ_OPENTARGETS_TARGETS_TABLE=$_BQ_OPENTARGETS_TARGETS_TABLE
      - BQ_LOCATION=$_BQ_LOCATION

  # Step 4: BigQuery → Postgres
  - name: gcr.io/$PROJECT_ID/dwh-pipeline:$BUILD_ID
    id: bq-to-postgres
    dir: /app/bq_to_postgres
    entrypoint: python3
    args:
      - bq_to_postgres.py
      - --bq-dataset
      - $_BQ_DATASET
      - --bq-location
      - $_BQ_LOCATION
      - --pg-conn
      - $_PG_CONN_INTERNAL
      - --gcs-bucket
      - $_GCLOUD_TMP_BUCKET
      - --drop-and-recreate-indexes
      - --force-pg-tables
      - $_FORCE_PG_TABLES
    env:
      - GCLOUD_PROJECT=$_GCLOUD_PROJECT
      - PG_CRISPR_DATA_TABLE=$_PG_CRISPR_DATA_TABLE
      - PG_MAVE_DATA_TABLE=$_PG_MAVE_DATA_TABLE
      - PG_PERTURB_SEQ_DEA_TABLE=$_PG_PERTURB_SEQ_DEA_TABLE
      - PG_PERTURB_SEQ_GSEA_TABLE=$_PG_PERTURB_SEQ_GSEA_TABLE
      - PG_SYNC_STATE_TABLE=$_PG_SYNC_STATE_TABLE
      - PG_PERTURB_SEQ_SUMMARY_PERTURBATION=$_PG_PERTURB_SEQ_SUMMARY_PERTURBATION
      - PG_PERTURB_SEQ_SUMMARY_EFFECT=$_PG_PERTURB_SEQ_SUMMARY_EFFECT
      - PG_PERTURB_SEQ_SUMMARY_DATASET=$_PG_PERTURB_SEQ_SUMMARY_DATASET

  # Step 5: BigQuery → Elasticsearch
  - name: gcr.io/$PROJECT_ID/dwh-pipeline:$BUILD_ID
    id: bq-to-es
    dir: /app/bq_to_elastic
    entrypoint: python3
    args:
      - bq_to_es_projector.py
      - --dataset-metadata
      - /app/be/dataset_metadata.json
    env:
      - GCLOUD_PROJECT=$_GCLOUD_PROJECT
      - BQ_DATASET=$_BQ_DATASET
      - ES_URL=$_ES_URL
      - ES_USERNAME=$_ES_USERNAME
      - ES_PASSWORD=$_ES_PASSWORD
      - ES_DATASET_SUMMARY=$_ES_DATASET_SUMMARY
      - ES_TARGET_SUMMARY=$_ES_TARGET_SUMMARY
      - ES_LANDING_PAGE_SUMMARY=$_ES_LANDING_PAGE_SUMMARY

substitutions:
  _OPENTARGETS_RELEASE: "26.03"
  _SUPPRESS_DATASETS: ""
  _FORCE_PG_TABLES: ""
