version: 2

sources:
  - name: crispr
    description: "Crispr metadata and data"
    database: "{{ env_var('GCLOUD_PROJECT') }}"   # GCP project id
    schema: crispr                   # BigQuery dataset
    tables:
      - name: metadata
        description: "Sample-level metadata"
      - name: data
        description: "CRISPR scores per (dataset_id, sample_id)"
  - name: mave
    description: "MAVE metadata and data"
    database: "{{ env_var('GCLOUD_PROJECT') }}"   # GCP project id
    schema: mavedb                   # BigQuery dataset
    tables:
      - name: metadata
        description: "Sample-level metadata"
      - name: data
        description: "MAVE scores per (dataset_id, sample_id)"
  - name: perturb_seq
    description: "Perturb-seq metadata and data"
    database: "{{ env_var('GCLOUD_PROJECT') }}"   # GCP project id
    schema: perturb_seq                   # BigQuery dataset
    tables:
      - name: metadata
        description: "Sample-level metadata"
      - name: pertpy_dea
        description: "DEA per dataset, perturbed target ENSG, and effect gene ENSG"
      - name: pertpy_gsea
        description: "GSEA results per dataset and perturbed target ENSG"
      - name: reprocessed_datasets
        description: "Perturb-seq datasets reprocessed by the catalogue"
  - name: reference
    description: "Reference data loaded from external canonical resources"
    database: "{{ env_var('GCLOUD_PROJECT') }}"   # GCP project id
    schema: "{{ env_var('BQ_DATASET') }}"                   # BigQuery dataset
    tables:
      - name: opentargets_targets
        description: "Open Targets Platform target table keyed by Ensembl gene ID"
