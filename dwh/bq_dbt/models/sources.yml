version: 2

sources:
  - name: crispr
    description: "Crispr metadata and data"
    database: prj-ext-dev-pertcat-437314   # GCP project id
    schema: "{{ 'crispr' ~ env_var('BQ_SOURCE_SUFFIX', '') }}"                   # BigQuery dataset
    tables:
      - name: metadata
        description: "Sample-level metadata"
      - name: data
        description: "CRISPR scores per (dataset_id, sample_id)"
  - name: mave
    description: "MAVE metadata and data"
    database: prj-ext-dev-pertcat-437314   # GCP project id
    schema: "{{ 'mavedb' ~ env_var('BQ_SOURCE_SUFFIX', '') }}"                   # BigQuery dataset
    tables:
      - name: metadata
        description: "Sample-level metadata"
      - name: data
        description: "MAVE scores per (dataset_id, sample_id)"
  - name: perturb_seq
    description: "Perturb-seq metadata and data"
    database: prj-ext-dev-pertcat-437314   # GCP project id
    schema: "{{ 'perturb_seq' ~ env_var('BQ_SOURCE_SUFFIX', '') }}"                   # BigQuery dataset
    tables:
      - name: metadata
        description: "Sample-level metadata"
      - name: pertpy_dea
        description: "DEA per (dataset_id, perturbed_target_id)"
      - name: pertpy_gsea
        description: "GSEA results per (dataset_id, perturbed_target_id)"
