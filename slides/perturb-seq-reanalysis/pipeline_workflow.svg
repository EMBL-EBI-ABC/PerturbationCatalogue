<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #374151; stroke-width: 2; rx: 14; ry: 14; }
      .input { fill: #eef2ff; stroke: #4f46e5; }
      .process { fill: #ecfeff; stroke: #0891b2; }
      .merge { fill: #fef3c7; stroke: #d97706; }
      .output { fill: #ecfdf5; stroke: #059669; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #374151; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #4b5563; }
      .arrow { stroke: #374151; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .lane { stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 7 7; fill: none; }
    </style>
  </defs>

  <rect x="20" y="30" width="1240" height="540" rx="22" fill="#f9fafb" stroke="#e5e7eb"/>

  <rect class="box input" x="60" y="88" width="210" height="108"/>
  <text class="label" x="165" y="130" text-anchor="middle">FASTQs</text>
  <text class="small" x="165" y="162" text-anchor="middle">mRNA + sgRNA</text>

  <rect class="box input" x="60" y="240" width="210" height="108"/>
  <text class="label" x="165" y="282" text-anchor="middle">Metadata</text>
  <text class="small" x="165" y="314" text-anchor="middle">ENA library names</text>

  <rect class="box input" x="60" y="392" width="210" height="108"/>
  <text class="label" x="165" y="434" text-anchor="middle">References</text>
  <text class="small" x="165" y="466" text-anchor="middle">Ensembl + guides</text>

  <rect class="box process" x="330" y="205" width="210" height="118"/>
  <text class="label" x="435" y="250" text-anchor="middle">Prepare</text>
  <text class="small" x="435" y="282" text-anchor="middle">group runs by</text>
  <text class="small" x="435" y="306" text-anchor="middle">physical well</text>

  <path class="arrow" d="M270 142 C300 142 300 225 330 245"/>
  <path class="arrow" d="M270 294 L330 274"/>
  <path class="arrow" d="M270 446 C300 446 300 320 330 300"/>

  <rect class="lane" x="590" y="72" width="285" height="180" rx="18"/>
  <rect class="box process" x="625" y="108" width="215" height="96"/>
  <text class="label" x="732" y="148" text-anchor="middle">cDNA count</text>
  <text class="small" x="732" y="178" text-anchor="middle">kb count standard</text>

  <rect class="lane" x="590" y="328" width="285" height="180" rx="18"/>
  <rect class="box process" x="625" y="364" width="215" height="96"/>
  <text class="label" x="732" y="404" text-anchor="middle">Guide count</text>
  <text class="small" x="732" y="434" text-anchor="middle">kb count KITE</text>

  <path class="arrow" d="M540 248 C578 218 590 166 625 156"/>
  <path class="arrow" d="M540 280 C578 310 590 402 625 412"/>

  <rect class="box merge" x="935" y="205" width="220" height="124"/>
  <text class="label" x="1045" y="250" text-anchor="middle">Merge</text>
  <text class="small" x="1045" y="282" text-anchor="middle">correct + align</text>
  <text class="small" x="1045" y="306" text-anchor="middle">GEX/KITE barcodes</text>

  <path class="arrow" d="M840 156 C890 164 900 220 935 244"/>
  <path class="arrow" d="M840 412 C890 400 900 315 935 292"/>

  <rect class="box output" x="935" y="392" width="220" height="108"/>
  <text class="label" x="1045" y="434" text-anchor="middle">Raw H5AD</text>

  <path class="arrow" d="M1045 329 L1045 392"/>

  <text class="note" x="435" y="360" text-anchor="middle">prevents within-sample mixups</text>
</svg>
